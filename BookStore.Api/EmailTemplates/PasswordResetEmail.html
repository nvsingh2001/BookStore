<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset your password</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f4f5f7;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: #1f2933;
  }
  .page {
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: #d1242f;
  }
  .header h1 {
    margin: 0;
    color: #ffffff;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .body {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 32px 28px;
  }
  .body p {
    margin: 0;
    line-height: 1.5;
    font-size: 15px;
  }
  .code-row {
    display: flex;
    justify-content: center;
    padding: 8px 0;
  }
  .code {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 24px;
    background-color: #f4f5f7;
    border: 1px dashed #c9d1d9;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #1f2933;
    word-break: break-all;
    text-align: center;
  }
  .muted {
    color: #6b7280;
    font-size: 13px;
  }
  .footer {
    display: flex;
    justify-content: center;
    padding: 20px 28px 28px;
  }
  .footer p {
    margin: 0;
    color: #9aa4b2;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>BookStore</h1>
      </div>
      <div class="body">
        <p>Hi there,</p>
        <p>We received a request to reset your password. Use the code below to complete the reset:</p>
        <div class="code-row">
          <span class="code">{{Code}}</span>
        </div>
        <p class="muted">This code expires in 15 minutes.</p>
      </div>
      <div class="footer">
        <p>If you didn't request a password reset, you can safely ignore this email.</p>
      </div>
    </div>
  </div>
</body>
</html>
